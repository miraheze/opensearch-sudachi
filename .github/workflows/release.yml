name: Build and Release

on:
  workflow_dispatch:
    inputs:
      opensearch_version:
        description: 'OpenSearch version to build and release (e.g., 3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      OPENSEARCH_VERSION: ${{ inputs.opensearch_version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$OPENSEARCH_VERSION" -m "Released version $OPENSEARCH_VERSION"
          git push origin "$OPENSEARCH_VERSION"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew -PengineVersion="os:$OPENSEARCH_VERSION" clean build -x test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$OPENSEARCH_VERSION" build/distributions/*.zip \
            --title "$OPENSEARCH_VERSION" \
            --notes "Sudachi analysis plugin for OpenSearch $OPENSEARCH_VERSION"
